<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#131317" />
    <title>Sem conexão</title>
    <link rel="icon" href="/icons/icone-192.png" />
    <style>
      :root {
        color-scheme: dark;
        --fundo: #131317;
        --texto: #f7f7f8;
        --apagado: #a1a1aa;
        --borda: rgba(255, 255, 255, 0.12);
        --amarelo: #f6c400;
        --amarelo-texto: #241f04;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--fundo);
        color: var(--texto);
        font-family:
          "Poppins",
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        letter-spacing: -0.012em;
        padding: max(1.5rem, env(safe-area-inset-top)) 1.5rem
          max(1.5rem, env(safe-area-inset-bottom));
        -webkit-text-size-adjust: 100%;
      }
      main {
        display: flex;
        max-width: 22rem;
        flex-direction: column;
        align-items: center;
        gap: 0.75rem;
        text-align: center;
      }
      .marca {
        display: grid;
        place-items: center;
        width: 3.5rem;
        height: 3.5rem;
        margin-bottom: 0.5rem;
        border: 1px solid var(--borda);
        border-radius: 1rem;
      }
      .marca svg {
        width: 1.75rem;
        height: 1.75rem;
        fill: var(--amarelo);
      }
      h1 {
        margin: 0;
        font-size: 1.25rem;
        font-weight: 600;
        letter-spacing: -0.025em;
      }
      p {
        margin: 0;
        font-size: 0.9375rem;
        line-height: 1.5;
        color: var(--apagado);
      }
      button {
        margin-top: 0.75rem;
        min-height: 44px;
        padding: 0 1.25rem;
        border: 0;
        border-radius: 0.65rem;
        background: var(--amarelo);
        color: var(--amarelo-texto);
        font: inherit;
        font-size: 0.9375rem;
        font-weight: 600;
        cursor: pointer;
      }
      button:active {
        transform: translateY(1px);
      }
    </style>
  </head>
  <body>
    <main>
      <div class="marca" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M14.5 2 5 13.5h5.5L9.5 22 19 10.5h-5.5Z" /></svg>
      </div>
      <h1>Sem conexão</h1>
      <p>
        O celular está sem internet agora, então não dá para carregar as ofertas. Assim que a
        conexão voltar, toque em recarregar.
      </p>
      <button type="button" onclick="location.reload()">Tentar de novo</button>
    </main>
    <script>
      // Assim que a conexão voltar, recarrega sozinho.
      addEventListener("online", () => location.reload());
    </script>
  </body>
</html>
